version: 2

models:
  - name: climate_baseline
    description: Smoothed 1961-1990 normal per city and calendar day.
    columns:
      - name: location_id
        data_tests: [not_null]
      - name: baseline_mean_c
        data_tests: [not_null]

  - name: fact_climate_anomaly
    description: Daily deviation from the baseline, with hot-day and heatwave flags.
    columns:
      - name: location_id
        data_tests: [not_null]
      - name: date_key
        data_tests: [not_null]
      - name: anomaly_c
        data_tests: [not_null]
