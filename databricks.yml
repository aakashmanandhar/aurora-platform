bundle:
  name: aurora

include:
  - resources/*.yml

sync:
  exclude:
    - api/**
    - web/**

variables:
  catalog:
    description: Unity Catalog catalog this environment reads from and writes to.
  locations_file:
    description: City list this environment ingests, relative to the bundle root.
  upload_url:
    description: Website API that receives the daily export, or none to keep files in the volume.

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-6ae801ba-74ba.cloud.databricks.com
    variables:
      catalog: aurora_dev
      locations_file: config/locations.csv
      upload_url: none

  prod:
    mode: production
    workspace:
      host: https://dbc-6ae801ba-74ba.cloud.databricks.com
      root_path: /Workspace/Users/aakashmanandhardata@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: aurora
      locations_file: config/locations_prod.csv
      upload_url: https://aakashmanandhar.tech/aurora/api
    permissions:
      - user_name: aakashmanandhardata@gmail.com
        level: CAN_MANAGE
