server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    client_max_body_size 5m;

    location = /aurora {
        return 301 /aurora/;
    }

    # The API runs in its own container. The prefix is removed before forwarding.
    location /aurora/api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Built files have a fingerprint in their name, so browsers may keep them.
    location /aurora/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /aurora/ {
        try_files $uri $uri/ /aurora/index.html;
    }
}
