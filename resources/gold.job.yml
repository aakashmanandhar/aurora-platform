resources:
  jobs:
    aurora_gold:
      name: aurora_gold
      tasks:
        - task_key: dbt_build
          dbt_task:
            project_directory: ../dbt
            warehouse_id: 7b6370e08ed8e9c0
            catalog: ${var.catalog}
            schema: gold
            commands:
              - "dbt build"
          environment_key: dbt
      environments:
        - environment_key: dbt
          spec:
            environment_version: "2"
            dependencies:
              - "dbt-databricks>=1.8.0,<2.0.0"
