resources:
  jobs:
    aurora_ml_backtest:
      name: aurora_ml_backtest
      tasks:
        - task_key: backtest
          spark_python_task:
            python_file: ../src/ml/backtest_temperature.py
            parameters:
              - "--experiment=/Users/${workspace.current_user.userName}/${var.catalog}_temperature_forecast"
              - "--features-table=${var.catalog}.ml.features_temperature"
              - "--metrics-table=${var.catalog}.ml.backtest_metrics"
          environment_key: ml
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - "lightgbm>=4.0,<5.0"
              - "mlflow>=2.16,<3"

    aurora_ml_train:
      name: aurora_ml_train
      tasks:
        - task_key: train
          spark_python_task:
            python_file: ../src/ml/train_temperature.py
            parameters:
              - "--experiment=/Users/${workspace.current_user.userName}/${var.catalog}_temperature_forecast"
              - "--features-table=${var.catalog}.ml.features_temperature"
              - "--model-name=${var.catalog}.ml.temperature_forecaster"
          environment_key: ml
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - "lightgbm>=4.0,<5.0"
              - "mlflow>=2.16,<3"

    aurora_ml_score:
      name: aurora_ml_score
      tasks:
        - task_key: score
          spark_python_task:
            python_file: ../src/ml/score_temperature.py
            parameters:
              - "--model-name=${var.catalog}.ml.temperature_forecaster"
              - "--features-table=${var.catalog}.ml.features_temperature"
              - "--baseline-table=${var.catalog}.gold.climate_baseline"
              - "--forecast-table=${var.catalog}.gold.fact_forecast"
          environment_key: ml
      environments:
        - environment_key: ml
          spec:
            environment_version: "2"
            dependencies:
              - "lightgbm>=4.0,<5.0"
              - "mlflow>=2.16,<3"
