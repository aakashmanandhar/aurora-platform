resources:
  jobs:
    aurora_ingestion:
      name: aurora_ingestion
      tasks:
        - task_key: extract_locations
          spark_python_task:
            python_file: ../src/ingestion/extract_locations.py
            parameters:
              - "--locations"
              - "${workspace.file_path}/config/locations.csv"
              - "--landing=/Volumes/${var.catalog}/bronze/landing"
          environment_key: default
        - task_key: extract_weather
          depends_on:
            - task_key: extract_locations
          spark_python_task:
            python_file: ../src/ingestion/extract_weather.py
            parameters:
              - "--landing=/Volumes/${var.catalog}/bronze/landing"
              - "--catalog=${var.catalog}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
