name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check src

      - name: Check Python compiles
        run: python -m compileall -q src

  bundle-validate:
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      DATABRICKS_HOST: https://dbc-6ae801ba-74ba.cloud.databricks.com
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: databricks/setup-cli@main
        with:
          version: 1.20.0

      - name: Validate bundle
        run: databricks bundle validate
