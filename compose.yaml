services:
  api:
    build: ./api
    ports:
      - "8010:8000"
    environment:
      AURORA_DATA_DIR: /data/export
    volumes:
      - ./data/export:/data/export:ro

  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5174:5174"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  web_node_modules:
